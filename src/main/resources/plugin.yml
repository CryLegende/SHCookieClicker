name: SHCookieClicker
version: ${project.version}
main: org.Cry_Legende.sHCookieClicker.SHCookieClicker
api-version: '26.3'
author: Cry_Legende
description: "Cookie Clicker de SkyHand : clicker du spawn, améliorations, designs, cookie doré, explosion de cookies et classement."
softdepend:
  - Multiverse-Core
  - PlaceholderAPI
  - SHNetwork
  - SHSkins

commands:
  shcookieclicker:
    description: Administration du Cookie Clicker
    aliases:
      - cookieclicker
    usage: /shcookieclicker
  cookies:
    description: Vos statistiques du Cookie Clicker, ou celles d'un autre joueur
    aliases:
      - cookie
    usage: /cookies [joueur]

permissions:
  shcookieclicker.use:
    description: /cookies, statistiques du Cookie Clicker
    default: true
  shcookieclicker.premium:
    description: Boutique VipElite du Cookie Clicker
    default: op
  shcookieclicker.admin:
    description: Toute l'administration du Cookie Clicker
    default: op
    children:
      shcookieclicker.admin.reload: true
      shcookieclicker.admin.list: true
      shcookieclicker.admin.set: true
      shcookieclicker.admin.remove: true
      shcookieclicker.admin.modify: true
      shcookieclicker.admin.reset: true
      shcookieclicker.admin.import: true
  shcookieclicker.admin.reload:
    description: /shcookieclicker reload
    default: op
  shcookieclicker.admin.list:
    description: /shcookieclicker list
    default: op
  shcookieclicker.admin.set:
    description: /shcookieclicker set clicker
    default: op
  shcookieclicker.admin.remove:
    description: /shcookieclicker remove clicker
    default: op
  shcookieclicker.admin.modify:
    description: /shcookieclicker modify
    default: op
  shcookieclicker.admin.reset:
    description: /shcookieclicker reset
    default: op
  shcookieclicker.admin.import:
    description: /shcookieclicker import (mode réseau)
    default: op
