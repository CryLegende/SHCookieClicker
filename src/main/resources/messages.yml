# ============================================================================
#  SHCookieClicker : messages du chat, barre d'action, titres et hologrammes
# ============================================================================
#  Codes couleur & et &#RRGGBB acceptés. Format SkyHand pour le chat : préfixe
#  de la couleur du type, texte en &7, mots importants dans la couleur du type.
#    &a succès · &e information · &6 avertissement · &c erreur
#  Un message vide n'est pas envoyé. Une clé absente prend le texte du jar.
#  Les textes des menus sont dans menus.yml.
# ============================================================================

commande:
  inconnue: '&7&l« &f&lSH &8&l» &fCommande inconnue, essayer autre chose.'
  # {commandes} = sous-commandes permises à l'expéditeur.
  utilisation: '&7&l« &e&lSH &8&l» &7Utilisation : &e/shcookieclicker <{commandes}>'
  # {syntaxe} = forme attendue de la sous-commande.
  syntaxe: '&7&l« &e&lSH &8&l» &7Syntaxe : &e/shcookieclicker {syntaxe}'
  reservee-joueur: '&7&l« &c&lSH &8&l» &7Cette commande est &créservée aux joueurs&7.'
  joueur-inconnu: '&7&l« &c&lSH &8&l» &7Ce joueur n''a &cjamais joué &7au Cookie Clicker.'
  pas-un-nombre: '&7&l« &c&lSH &8&l» &c{valeur} &7n''est pas un nombre.'
  base-injoignable: '&7&l« &c&lSH &8&l» &7Le Cookie Clicker n''est &cpas connecté &7à sa base de données.'

rechargement:
  ok: '&7&l« &a&lSH &8&l» &7Configuration &arechargée&7.'
  redemarrage: '&8• &7Les sections &6base-de-donnees &7et &6reseau &7demandent un redémarrage.'
  # {fichier} = fichier illisible, {erreur} = détail.
  erreur: '&7&l« &c&lSH &8&l» &7Rechargement annulé, &crien n''a changé&7. &c{fichier}&7 : &c{erreur}'

clickers:
  liste-titre: '&7&l« &e&lSH &8&l» &7Clickers :'
  # {numero}, {monde}, {x}, {y}, {z}
  liste-ligne: '&8• &eClicker {numero} &7({monde} {x} {y} {z})'
  liste-survol: '&7Cliquez pour vous téléporter'
  liste-vide: '&7&l« &e&lSH &8&l» &7Aucun clicker posé.'
  pose: '&7&l« &e&lSH &8&l» &7Faites un &eclic droit &7sur le bloc qui deviendra le &eclicker {numero}&7.'
  pose-annulee: '&7&l« &c&lSH &8&l» &7Pose du clicker &cannulée&7.'
  deja: '&7&l« &c&lSH &8&l» &7Ce bloc est &cdéjà un clicker&7.'
  ajoute: '&7&l« &a&lSH &8&l» &7Clicker &a{numero} &7posé.'
  retire: '&7&l« &a&lSH &8&l» &7Clicker &a{numero} &7retiré.'
  inconnu: '&7&l« &c&lSH &8&l» &7Le clicker &c{numero} &7n''existe pas.'

administration:
  # {valeur} = type demandé.
  type-inconnu: '&7&l« &c&lSH &8&l» &c{valeur} &7n''est pas un type : &fCOOKIES&7, &fPER_CLICK &7ou &fCLICKER_CLICKS&7.'
  # {type}, {joueur}, {valeur} = nouvelle valeur.
  modifie: '&7&l« &a&lSH &8&l» &e{type} &7de &e{joueur} &7: &a{valeur}&7.'
  remis-a-zero: '&7&l« &a&lSH &8&l» &7Progression de &e{joueur} &aremise à zéro&7.'

cookie-mobile:
  # {secondes} = durée.
  active: '&7&l« &a&lSH &8&l» &7Cookie mobile &aactivé &7pour &a{secondes} s&7.'
  arrete: '&7&l« &a&lSH &8&l» &7Cookie mobile &aarrêté&7.'
  inactif: '&7&l« &e&lSH &8&l» &7Le cookie mobile &en''est pas en cours&7.'

reseau:
  # {joueur}, {serveur}
  transmis: '&7&l« &e&lSH &8&l» &e{joueur} &7est sur &e{serveur}&7 : la commande lui a été &etransmise&7.'
  import-sans-reseau: '&7&l« &c&lSH &8&l» &7Cette commande demande le &cmode réseau &7(SHNetwork installé et base joignable).'
  import-sans-fichier: '&7&l« &c&lSH &8&l» &7Aucun fichier &ccookieclicker.db &7à importer.'
  import-debut: '&7&l« &e&lSH &8&l» &7Copie de la progression du fichier SQLite dans la base du réseau...'
  # {ajoutes}, {presents} = joueurs copiés, joueurs déjà dans la base du réseau.
  import-fin: '&7&l« &a&lSH &8&l» &7Copie terminée : &a{ajoutes} &7joueur(s) ajouté(s), &e{presents} &7déjà présent(s).'
  import-echec: '&7&l« &c&lSH &8&l» &7La copie a &céchoué&7, voir la console.'

# Barre d'action. {cookies} = cookies du joueur, {gain} = cookies du cookie ramassé.
barre:
  clic: '&7Vos cookies &8&l» &6{cookies} ❂'
  ramassage: '&7Vos cookies &8&l» &6{cookies} ❂ &7+ &e{gain}'
  trop-rapide: '&cVeuillez cliquer moins vite'
  afk: '&cANTI AFK &7Veuillez vous déplacer'

# Pendant le cookie doré, la barre « clic » scintille de ces deux couleurs.
cookie-dore:
  titre: '&6&lCOOKIE DORÉ'
  sous-titre: '&7Vos clics rapportent &6beaucoup plus &7!'
  couleur: '&6'
  reflet: '&e'

explosion:
  titre: '&c&lEXPLOSION DE COOKIES'
  sous-titre: '&7Ramassez-les avant qu''ils ne disparaissent !'

boutique:
  # {manque} = cookies manquants.
  trop-cher: '&7&l« &c&lSH &8&l» &7Il vous manque &c{manque} ❂ &7pour cet achat.'
  vipelite-requis: '&7&l« &c&lSH &8&l» &7Cette boutique est réservée au grade &dVipElite&7.'

# /cookies : {joueur}, {place}, {cookies}, {par-clic}, {clics}
stats:
  - '&7&l« &6&lCookie Clicker &8&l» &7de &6{joueur}'
  - '&8• &7Classement &8&l» &e{place}'
  - '&8• &7Cookies &8&l» &6{cookies} ❂'
  - '&8• &7Cookies par clic &8&l» &e{par-clic} ❂'
  - '&8• &7Clics sur le clicker &8&l» &e{clics}'

hologrammes:
  # Au-dessus de chaque clicker (hologrammes.clicker dans config.yml).
  clicker:
    - '&8&l» &6Cookie Clicker &8&l«'
    - '&7(&fClic droit &7-> &aMenu&7)'
    - '&7(&fClic gauche &7-> &6Cookie !&7)'
  # Au-dessus d'un cookie ramassé, {gain} = cookies gagnés.
  gain: '&7+ &6{gain} cookies'
