# ============================================================================
#  SHCookieClicker : le Cookie Clicker du spawn
# ============================================================================
#
#  Clic gauche sur un clicker : des cookies (autant que les cookies par clic
#  du joueur). Clic droit : le menu, avec la boutique d'améliorations (des
#  cookies par clic en plus, prix qui monte à chaque achat), la boutique
#  VipElite et les designs (bloc du clicker, effet de coup).
#  Au hasard d'un clic : le cookie doré (clics multipliés un moment) ou
#  l'explosion de cookies (des cookies à ramasser, visibles du seul joueur).
#  Un clic au-delà du nombre de clics par seconde permis, ou d'un joueur qui
#  n'a pas bougé depuis un moment, ne rapporte rien.
#
#  Commandes :
#    /cookies [joueur]                     Statistiques (alias : /cookie).
#    /shcookieclicker reload               Relit config.yml, messages.yml, menus.yml et locations.yml.
#                                          Un fichier illisible ne change rien. base-de-donnees et
#                                          reseau demandent un redémarrage.
#    /shcookieclicker list                 Liste les clickers (clic : téléportation).
#    /shcookieclicker set clicker <n>      Puis clic droit sur un bloc : il devient le clicker n.
#    /shcookieclicker remove clicker <n>   Retire le clicker n.
#    /shcookieclicker modify <joueur> <add|set|remove> <COOKIES|PER_CLICK|CLICKER_CLICKS> <n>
#    /shcookieclicker reset <joueur>       Remet à zéro la progression d'un joueur.
#    /shcookieclicker import               Mode réseau : copie la progression du fichier SQLite
#                                          dans la base du réseau, sans rien écraser.
#    L'ancien nom /cookieclicker reste accepté (alias de /shcookieclicker).
#
#  Permissions :
#    shcookieclicker.use             /cookies (tout le monde)
#    shcookieclicker.premium         Boutique VipElite (op)
#    shcookieclicker.admin           Toutes les sous-commandes de /shcookieclicker (op)
#    shcookieclicker.admin.<sous-commande>  reload, list, set, remove, modify, reset, import (op)
#
#  Placeholders (nombres au format 1,234,567) :
#    %cookieclicker_cookies%        cookies du joueur
#    %cookieclicker_perclick%       cookies par clic
#    %cookieclicker_clickerclicks%  clics sur le clicker
#    %cookieclicker_place%          place au classement des cookies (N/A sans cookies)
#
#  Boutiques :
#    ameliorations, vipelite   materiau (icône), prix (premier achat), hausse (ajoutée au prix
#                              à chaque achat), gain (cookies par clic gagnés par achat).
#                              Clic : un achat ; shift-clic : dix achats d'un coup (ou autant
#                              que les cookies le permettent).
#    designs                   s'achètent une fois, puis se sélectionnent (clic gauche) ou se
#                              retirent (clic droit sur le design sélectionné). Le menu les range
#                              par prix, du moins cher au plus cher.
#      blocs    bloc ou tête qui flotte au-dessus du clicker, à la place de la tête de cookie
#               (apparence). TETE_JOUEUR : la tête du joueur (skin de SHSkins) ;
#               PLAYER_HEAD avec texture : une tête à texture.
#      effets   animation (SPIRALE, ANNEAUX, ONDE, ETOILE, TOURBILLON), particule,
#               particule-secondaire (TOURBILLON), couleur '#RRGGBB' (poussière colorée à la
#               place de la particule). Effet vu du seul joueur, au plus un à la fois.
#    Le numéro d'un article est sa clé dans la base : ne pas renuméroter.
#
#  Sons : clé de son (entity.item.pickup, minecraft:entity.item.pickup ou la clé d'un son
#  d'un pack de ressources). Vide : pas de son. Un son inconnu est signalé au chargement.
# ============================================================================

base-de-donnees:
  # sqlite : fichier cookieclicker.db du dossier du plugin ; mysql : la base ci-dessous.
  # Avec SHNetwork, voir la section reseau.
  type: sqlite
  mysql:
    hote: localhost
    port: 3306
    nom: CookieClicker
    utilisateur: root
    mot-de-passe: CHANGE_ME
  # Écriture des progressions modifiées, en secondes. Un joueur est aussi écrit à son départ,
  # et tout le monde à l'arrêt du serveur.
  sauvegarde-secondes: 60

clics:
  # Clics par seconde permis. Chaque clic remplit un seau qui se vide de ce nombre par seconde :
  # quand il déborde, les clics ne rapportent plus rien jusqu'à ce que le joueur ralentisse.
  max-par-seconde: 12
  # Un joueur qui n'a pas changé de bloc depuis ce délai ne gagne plus rien (anti-AFK), en
  # secondes. Fermer un menu du clicker compte comme un mouvement. 0 : désactivé.
  anti-afk-secondes: 15

cookie-dore:
  # Un clic sur « chance » lance le cookie doré.
  chance: 5000
  duree-secondes: 60
  # Les clics rapportent les cookies par clic multipliés par ce nombre.
  multiplicateur: 2

explosion:
  # Un clic sur « chance » lance une explosion de cookies.
  chance: 2500
  cookies: 20
  # Les cookies non ramassés disparaissent après ce délai.
  duree-secondes: 30
  # Un cookie ramassé rapporte les cookies par clic multipliés par ce nombre.
  multiplicateur: 10

classement:
  # Recalcul de %cookieclicker_place%, en secondes (seulement si des cookies ont changé).
  rafraichissement-secondes: 30

hologrammes:
  # Texte au-dessus de chaque clicker, le même pour tous (lignes : hologramme-clicker dans messages.yml).
  clicker: false
  # Gain qui s'élève au-dessus d'un cookie ramassé pendant une explosion.
  gains: true

# Le clicker : un objet qui flotte (une tête de cookie, ou le bloc ou la tête choisis dans les designs) et la zone
# invisible où il faut cliquer, plus large que lui. Un clicker n'a aucun bloc : « locations.yml » donne seulement
# sa case, l'objet flotte à « hauteur » au-dessus de son centre. Tout est envoyé en paquets à chaque joueur, qui voit
# le sien (le serveur n'en garde aucune entité) ; il demande le plugin packetevents. L'objet tourne sur lui-même en
# montant et en descendant doucement, et fait un bond à chaque clic qui compte, vu du seul joueur qui clique.
apparence:
  # Tête affichée quand le joueur n'a choisi aucun design : adresse textures.minecraft.net ou identifiant de texture.
  tete-par-defaut: http://textures.minecraft.net/texture/605ef8819fb6a92148249ff48c3914e92c273e7874523ff7930b9f5cc93ceaae
  # Distance d'affichage, en blocs (jamais plus que la distance de vue du joueur).
  rayon: 40
  # Hauteur du centre de l'objet au-dessus du centre du bloc du clicker, en blocs.
  hauteur: 0.5
  # Tailles : 1 pour une tête, c'est la taille d'une tête de mannequin ; en blocs pour un bloc.
  taille-tete: 1.0
  taille-bloc: 0.75
  # Zone de clic, centrée sur l'objet : largeur et hauteur, en blocs.
  zone-de-clic:
    largeur: 1.6
    hauteur: 1.6
  repos:
    # Durée d'un tour sur lui-même, en secondes.
    tour-secondes: 8
    # Amplitude de la montée et de la descente, en blocs, et durée de l'aller-retour, en secondes.
    flottement: 0.08
    flottement-secondes: 3
    # Un envoi tous les N ticks et par joueur ; le client lisse le mouvement entre deux envois.
    fluidite-ticks: 5
  coup:
    # Au sommet du bond : taille en plus (0.2 = 20 %) et hauteur en plus, en blocs.
    gonflement: 0.2
    bond: 0.12

affichage:
  # Séparateur des milliers dans les textes du plugin (1 234 567). Les placeholders gardent la virgule.
  separateur-milliers: ' '

