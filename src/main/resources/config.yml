# Chaque son répond à une action du joueur.
#   clic             un clic qui compte          clic-refuse      un clic refusé (trop rapide, immobile)
#   ouverture        clic droit : le menu        navigation       un sous-menu, la page suivante
#   retour           « Retour », page précédente vipelite         boutique VipElite ouverte
#   vipelite-refuse  VipElite sans le grade      achat            achat réussi
#   achat-refuse     pas assez de cookies        design-choisi    design sélectionné
#   design-retire    design retiré               stats            /cookies
#   cookie-dore      le cookie doré commence     explosion        une explosion de cookies commence
sons:
  actif: true
  clic:
    son: entity.item.pickup
    volume: 1.0
    hauteur: 1.0
  clic-refuse:
    son: block.anvil.break
    volume: 1.0
    hauteur: 1.0
  ouverture:
    son: ui.toast.in
    volume: 1.0
    hauteur: 1.0
  navigation:
    son: block.note_block.bass
    volume: 1.0
    hauteur: 1.0
  retour:
    son: entity.bat.takeoff
    volume: 1.0
    hauteur: 1.0
  vipelite:
    son: block.note_block.snare
    volume: 1.0
    hauteur: 1.0
  vipelite-refuse:
    son: block.anvil.break
    volume: 1.0
    hauteur: 1.0
  achat:
    son: entity.player.levelup
    volume: 1.0
    hauteur: 1.0
  achat-refuse:
    son: block.anvil.break
    volume: 1.0
    hauteur: 1.0
  design-choisi:
    son: block.note_block.pling
    volume: 1.0
    hauteur: 1.0
  design-retire:
    son: block.lava.pop
    volume: 1.0
    hauteur: 1.0
  stats:
    son: block.lava.pop
    volume: 1.0
    hauteur: 1.0
  cookie-dore:
    son: block.amethyst_block.hit
    volume: 1.0
    hauteur: 1.0
  explosion:
    son: block.end_portal.spawn
    volume: 1.0
    hauteur: 1.0

# Mode réseau, actif seulement si SHNetwork est installé et « actif » vaut true : la progression
# (cookies, cookies par clic, designs, achats) est dans la base partagée au lieu de la base
# ci-dessus. Le profil d'un joueur est relu à sa connexion, une fois que l'autre serveur a fini
# de l'écrire, et écrit à son départ. modify et reset visant un joueur d'un autre serveur lui
# sont transmis. Sans SHNetwork, cette section n'est pas lue.
reseau:
  actif: true
  # Attente maximale, en secondes, de la sauvegarde de l'autre serveur avant de lire le profil.
  attente-max-secondes: 10
  base-de-donnees:
    hote: 127.0.0.1
    port: 3306
    nom: bo_net
    utilisateur: shcookieclicker
    mot-de-passe: CHANGE_ME
