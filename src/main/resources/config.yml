# Sons. Chaque son répond à une action du joueur (nom de la clé = action).
#   click_allow          un clic sur le clicker compte
#   click_deny           un clic refusé (trop rapide ou joueur immobile)
#   open_inventory       clic droit sur le clicker : le menu s'ouvre
#   shop, design, block_design, hit_particle_design, menu_design
#                        ouverture d'un sous-menu depuis un bouton
#   next                 page suivante
#   back                 retour au menu précédent ou page précédente
#   premium_allow        ouverture de la boutique VipElite
#   premium_deny         boutique VipElite refusée (droit shcookieclicker.premium manquant)
#   buy_allow            achat réussi ; buy_deny : pas assez de cookies
#   select_design        design sélectionné ; remove_design : design retiré
#   stats_info           /shcookieclicker stats
#   golden_cookie        un cookie doré apparaît ; cookie_explosion : une explosion de cookies commence
sounds:
  click_allow:
    type: 'entity.item.pickup'
    volume: 1.0
    pitch: 1.0
  click_deny:
