# ======================================================================== #
# SHCookieClicker
#
# Plugin : CookieClicker de ZilloLP (licence CookieClicker 1.0, voir LICENSE), version SkyHand pour Paper 26.3.
# Les joueurs cliquent sur un bloc « clicker » pour gagner des cookies, achètent des améliorations et des designs
# dans la boutique et se comparent sur des murs de statistiques.
#
# Fichiers : config.yml (réglages, boutiques, sons), messages.yml (textes), menus.yml (menus), locations.yml
# (clickers, murs de statistiques, chronomètre), mysql.yml (base MySQL). Une clé absente d'un fichier prend la
# valeur du jar.
#
# Commande (alias : /cookieclicker) :
#   /shcookieclicker stats [joueur]                                  Statistiques d'un joueur (tout le monde).
#   /shcookieclicker list                                            Liste les clickers.
#   /shcookieclicker set clicker <n>                                 Fait d'un bloc (clic droit) le clicker <n>.
#   /shcookieclicker set resettimer                                  Place le chronomètre de réinitialisation à la position du joueur.
#   /shcookieclicker set statswall <alltime|time> <n>                Crée un mur de statistiques (clic droit sur une tête).
#   /shcookieclicker remove clicker <n>                              Retire le clicker <n>.
#   /shcookieclicker remove resettimer                               Retire le chronomètre de réinitialisation.
#   /shcookieclicker modify <joueur> <add|set|remove> <type> <n>     Modifie COOKIES, PER_CLICK ou CLICKER_CLICKS d'un joueur.
#   /shcookieclicker reset <joueur>                                  Réinitialise la progression d'un joueur.
#   /shcookieclicker import                                          Mode réseau : copie la progression SQLite dans la base du réseau.
#   /shcookieclicker reload                                          Relit config.yml, messages.yml, menus.yml, locations.yml et mysql.yml.
#                                                                    Un fichier illisible ne change rien. MySQL, mysql.yml et reseau demandent
#                                                                    un redémarrage.
#   Casser la tête ou la pancarte d'un mur de statistiques le supprime (droit shcookieclicker.admin.remove).
#
# Permissions (par défaut : op) :
#   shcookieclicker.admin          Toutes les sous-commandes d'administration.
#   shcookieclicker.admin.reload   /shcookieclicker reload
#   shcookieclicker.admin.list     /shcookieclicker list
#   shcookieclicker.admin.set      /shcookieclicker set
#   shcookieclicker.admin.remove   /shcookieclicker remove, et casser un mur de statistiques
#   shcookieclicker.admin.modify   /shcookieclicker modify
#   shcookieclicker.admin.reset    /shcookieclicker reset
#   shcookieclicker.admin.import   /shcookieclicker import
#   shcookieclicker.premium        Boutique VipElite.
#   La sous-commande stats est ouverte à tous.
#
# Têtes des joueurs (murs de statistiques, design de bloc REAL_PLAYER_HEAD) : le skin vient de SHSkins quand il est installé.
# Sans lui, la tête n'a que l'UUID et le pseudo (skin par défaut) ; le plugin ne fait aucune requête à Mojang.
#
# Boutiques (default_shop, premium_shop, block_design_shop, hit_particle_design_shop, menu_design_shop) :
#   item_type          matériau de l'icône (REAL_PLAYER_HEAD : tête du joueur ; PLAYER_HEAD avec skull_texture : tête à texture)
#   add_clicks         cookies par clic gagnés à chaque achat (améliorations)
#   base_price         prix du premier achat
#   price_step         hausse du prix à chaque achat : prix = base_price + achats × price_step (améliorations)
#   display_name       nom du design (block_type : bloc posé à la place du clicker, ou vitre du menu)
#   particle_type, second_particle_type, colored_dust, color, animation_type : effet de coup (SPIRAL, CIRCLE_RINGS,
#                      EXPLOSION_WAVE, STAR_BURST, MAGICAL_WHIRLWIND)
#   Les améliorations se rachètent sans limite ; un design s'achète une fois, puis se sélectionne gratuitement.
#
# Sons : « type » est une clé de son (entity.item.pickup, minecraft:entity.item.pickup, ou la clé d'un son d'un pack
# de ressources). Les anciens noms (ENTITY_ITEM_PICKUP) sont acceptés. Un nom inconnu est signalé dans la console au
# chargement et le son reste muet.
# ======================================================================== #

# Base de données : un serveur seul : SQLite (cookieclicker.db), ou MySQL avec mysql.yml ; avec SHNetwork, voir la section "reseau" en bas du fichier
MySQL: false

# Sauvegarde des joueurs modifiés, en minutes (un joueur est aussi sauvegardé à son départ)
Cache synchronization: 10

# Hologrammes d'aide au-dessus des clickers (textes : CLICKER_HOLOGRAM dans messages.yml)
Clicker holograms: false

# Sons du plugin (réglages dans la section sounds)
Sounds: true

# Durée du chronomètre de réinitialisation du classement par période, en minutes
Resettimer: 60

# Protections
# Clics par seconde maximum, au-delà ils ne comptent plus
Maximum CPS: 12
# Un joueur immobile depuis ce délai ne peut plus cliquer (anti-AFK)
AFK cooldown seconds: 15

# Explosion de cookies : un clic a 2 chances sur « Cookie explosion range » de faire jaillir des cookies que seul le joueur voit
Cookie amount: 20
Explosion duration seconds: 30
Cookies per cookie multiplier: 10
Cookie explosion range: 5000

# Cookie doré : un clic a 2 chances sur « Golden cookie range » de multiplier les cookies par clic pendant un moment
Golden duration seconds: 60
Per click multiplier: 2
Golden cookie range: 10000

