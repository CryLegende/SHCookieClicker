  menu:
    slot: 15
    material: PAINTING
    name: '&eFond des menus'
    lore:
      - ''
      - '&8• &7La couleur des vitres'
      - '&7qui entourent les menus'
      - ''
      - '&7&o(( &e&oCliquez &7&opour choisir &7&o))'

block-design:
  title: '&8&lMenu &8| Bloc du clicker'
  size: 36
  slots: 10-16
  accent-slots: 3, 5
  stats-slot: 4
  back-slot: 31

hit-particle-design:
  title: '&8&lMenu &8| Effet de coup'
  size: 36
  slots: 11-15
  accent-slots: 3, 5
  stats-slot: 4
  back-slot: 31

menu-design:
  title: '&8&lMenu &8| Fond des menus &8(%page%/%pages%)'
  size: 45
  slots: 10-16, 19-25, 28-34
  accent-slots: 3, 5
  stats-slot: 4
  back-slot: 40
  previous-page-slot: 39
  next-page-slot: 41

