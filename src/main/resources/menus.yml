# ============================================================================
#  SHCookieClicker : menus
# ============================================================================
#  Mise en page des menus de SkyHand : titre « &8&lMenu &8| Nom », cadre de
#  vitres noires (fond), vitres grises en accent, « Retour » en papier au
#  centre de la dernière ligne, flèches de page de part et d'autre du retour
#  quand une boutique a plus d'articles que de cases.
#
#  Cases : un numéro, ou une liste et des plages : « 10-16, 19-25 ».
#  Placeholders :
#    partout               {cookies} {par-clic} {clics} {place}
#    améliorations         {gain} {prix} {prix-x10} {achats} {manque}
#    designs               {nom} {prix} {manque}
#    titres à pages        {page} {pages}
#  Les sons sont dans config.yml, les messages du chat dans messages.yml.
#  Une clé absente prend la valeur du jar.
# ============================================================================

fond:
  materiau: BLACK_STAINED_GLASS_PANE
accent:
  materiau: GRAY_STAINED_GLASS_PANE

# Fiche du joueur, en haut de chaque menu.
fiche:
  materiau: COOKIE
  nom: '&6Vos cookies'
  lore:
    - ''
    - '&8• &7Cookies &8&l» &e{cookies} ❂'
    - '&8• &7Cookies par clic &8&l» &e{par-clic} ❂'
    - '&8• &7Clics sur le clicker &8&l» &e{clics}'
    - '&8• &7Classement &8&l» &e{place}'

retour:
  materiau: PAPER
  nom: '&c⤾ Retour &7(Clic)'

page-precedente:
  materiau: ARROW
  nom: '&fPage précédente'
  lore:
    - ''
    - '&7&o(( &f&oCliquez &7&opour voir la page précédente &7&o))'

page-suivante:
  materiau: ARROW
  nom: '&fPage suivante'
  lore:
    - ''
    - '&7&o(( &f&oCliquez &7&opour voir la page suivante &7&o))'

# Clic droit sur le clicker.
accueil:
  titre: '&8&lMenu &8| Cookie Clicker'
  lignes: 3
  accents: 10, 12, 14, 16
  fiche: 11
  boutique:
    case: 13
    materiau: EMERALD
    nom: '&aBoutique'
    lore:
      - ''
      - '&8&l« &7Des améliorations pour gagner'
      - '&7plus de cookies à chaque clic. &8&l»'
      - ''
      - '&7&o(( &a&oCliquez &7&opour ouvrir la boutique &7&o))'
  designs:
    case: 15
    materiau: PAINTING
    nom: '&bDesigns'
    lore:
      - ''
      - '&8&l« &7L''apparence du clicker et'
      - '&7de vos clics. &8&l»'
      - ''
      - '&7&o(( &b&oCliquez &7&opour choisir vos designs &7&o))'

boutique:
  titre: '&8&lMenu &8| Boutique'
  lignes: 4
  articles: 10-16
  accents: 3, 5
  fiche: 4
  retour: 31
  vipelite:
    case: 33
    materiau: NETHER_STAR
    nom: '&dBoutique VipElite'
    lore:
      - ''
      - '&8&l« &7Des améliorations plus puissantes,'
      - '&7réservées au grade &dVipElite&7. &8&l»'
      - ''
      - '&7&o(( &d&oCliquez &7&opour ouvrir la boutique &7&o))'
    lore-verrouille:
      - ''
      - '&8&l« &7Des améliorations plus puissantes,'
      - '&7réservées au grade &dVipElite&7. &8&l»'
      - ''
      - '&7&o(( &c&oGrade VipElite requis &7&o))'

vipelite:
  titre: '&8&lMenu &8| Boutique VipElite'
  lignes: 4
  articles: 10-16
  accents: 3, 5
  fiche: 4
  retour: 31

# Une amélioration se rachète sans limite, son prix monte à chaque achat.
amelioration:
  nom: '&6+{gain} ❂ &7par clic'
  lore-achetable:
    - ''
    - '&8• &7Prix &8&l» &a{prix} ❂'
    - '&8• &7Prix de dix &8&l» &e{prix-x10} ❂'
    - '&8• &7Achats &8&l» &f{achats}'
    - ''
    - '&7&o(( &a&oClic &7&opour acheter &7&o))'
    - '&7&o(( &a&oShift-clic &7&opour en acheter dix &7&o))'
  lore-trop-cher:
    - ''
    - '&8• &7Prix &8&l» &c{prix} ❂'
    - '&8• &7Prix de dix &8&l» &e{prix-x10} ❂'
    - '&8• &7Achats &8&l» &f{achats}'
    - ''
    - '&7&o(( &c&oIl vous manque &e{manque} ❂ &7&o))'

designs:
  titre: '&8&lMenu &8| Designs'
  lignes: 3
  accents: 11, 13, 15
  retour: 22
  blocs:
    case: 12
    materiau: PRISMARINE
    nom: '&bBloc du clicker'
    lore:
      - ''
      - '&8&l« &7Le bloc que vous voyez à'
      - '&7la place du clicker. &8&l»'
      - ''
      - '&7&o(( &b&oCliquez &7&opour choisir &7&o))'
  effets:
    case: 14
    materiau: DRAGON_BREATH
    nom: '&dEffet de coup'
    lore:
      - ''
      - '&8&l« &7L''animation qui accompagne'
      - '&7vos clics sur le clicker. &8&l»'
      - ''
      - '&7&o(( &d&oCliquez &7&opour choisir &7&o))'

designs-blocs:
  titre: '&8&lMenu &8| Bloc du clicker'
  lignes: 4
  articles: 10-16
  accents: 3, 5
  fiche: 4
  retour: 31

designs-effets:
  titre: '&8&lMenu &8| Effet de coup'
  lignes: 4
  articles: 11-15
  accents: 3, 5
  fiche: 4
  retour: 31

# Article des menus de designs, selon son état.
design:
  nom-achetable: '&a{nom}'
  nom-trop-cher: '&c{nom}'
  nom-possede: '&f{nom}'
  nom-selectionne: '&b{nom}'
  lore-achetable:
    - ''
    - '&8• &7Prix &8&l» &a{prix} ❂'
    - ''
    - '&7&o(( &a&oCliquez &7&opour acheter &7&o))'
  lore-trop-cher:
    - ''
    - '&8• &7Prix &8&l» &c{prix} ❂'
    - ''
    - '&7&o(( &c&oIl vous manque &e{manque} ❂ &7&o))'
  lore-possede:
    - ''
    - '&a✔ &7Acheté'
    - ''
    - '&7&o(( &e&oClic gauche &7&opour sélectionner &7&o))'
  lore-selectionne:
    - ''
    - '&b★ &7Sélectionné'
    - ''
    - '&7&o(( &c&oClic droit &7&opour le retirer &7&o))'
